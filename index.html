<title>Vocabulário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&display=swap">
<style>
:root{--bg:#f6f7fb;--surface:#fff;--ink:#14213d;--muted:#5d6785;--blue:#1f4e9c;--on-blue:#fff;--ochre:#e0a526;--line:#d9deec;--ok:#1f7a4d;--bad:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--surface:#17224a;--ink:#eef1fb;--muted:#9ba6c9;--blue:#7fa6f0;--on-blue:#0f1730;--ochre:#f0b940;--line:#2a3869;--ok:#58c58f;--bad:#f08a80}}
:root[data-theme="dark"]{--bg:#0f1730;--surface:#17224a;--ink:#eef1fb;--muted:#9ba6c9;--blue:#7fa6f0;--on-blue:#0f1730;--ochre:#f0b940;--line:#2a3869;--ok:#58c58f;--bad:#f08a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font:800 1.6rem/1.2 Fraunces,Georgia,serif;margin:8px 0 16px}
nav{display:flex;gap:8px;margin-bottom:20px}
nav button{flex:1;padding:10px;border:2px solid var(--blue);background:transparent;color:var(--blue);border-radius:10px;font:inherit;font-weight:600}
nav button[aria-selected="true"]{background:var(--blue);color:var(--on-blue)}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.card{background:var(--surface);border:2px solid var(--blue);border-radius:18px;padding:32px 20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;width:100%;color:var(--ink);font:inherit;box-shadow:6px 6px 0 var(--ochre)}
.word{font:800 2.2rem/1.2 Fraunces,Georgia,serif;overflow-wrap:anywhere}
.hint{color:var(--muted)}
.answer{font-size:1.4rem;font-weight:600;color:var(--blue)}
.row{display:flex;gap:10px;margin-top:22px}
.row button{flex:1;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;color:#fff}
.yes{background:var(--ok)}.no{background:var(--bad)}
.speak{margin-top:12px;background:none;border:1px solid var(--line);color:var(--blue);border-radius:999px;padding:6px 14px;font:inherit}
.stat{color:var(--muted);margin:0 0 12px;text-align:center}
form{display:grid;gap:10px;margin-bottom:20px}
input{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;width:100%}
form button{padding:12px;border:0;border-radius:10px;background:var(--blue);color:var(--on-blue);font:inherit;font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
li div{flex:1;min-width:0;overflow-wrap:anywhere}
li small{display:block;color:var(--muted)}
li button{background:none;border:0;color:var(--bad);font:inherit;padding:6px}
.all{margin-top:14px;padding:12px 18px;border-radius:10px;border:2px solid var(--blue);background:none;color:var(--blue);font:inherit;font-weight:600}
.res{margin:0;font-weight:600;text-align:center}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}.res.near{color:var(--ink)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.bx{border:2px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center;background:var(--surface);line-height:1.25}
.bx small{display:block;font-size:.72rem;font-weight:600}
.bx b{display:block;font:800 1.2rem/1.3 Fraunces,Georgia,serif}
.bx span{display:block;font-size:.72rem;color:var(--muted)}
.bx.cur{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.bx.cur span{color:var(--on-blue)}
.note{margin:0 0 12px;text-align:center;font-weight:600;color:var(--blue)}
summary{cursor:pointer;font-weight:600;color:var(--blue);padding:6px 0}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:.8rem/1.4 ui-monospace,Menlo,monospace;margin:8px 0}
textarea:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row2 button{padding:10px 4px;border:2px solid var(--blue);background:none;color:var(--blue);border-radius:10px;font:inherit;font-weight:600}
li{flex-wrap:wrap}
.acts{display:flex;gap:18px;width:100%}
.acts button,.acts a{background:none;border:0;padding:6px 0;font:inherit;font-size:.9rem;color:var(--blue);text-decoration:none;cursor:pointer}
.acts .del{color:var(--bad)}
.edit{margin:0;width:100%}
.lk{color:var(--blue);font-size:.9rem;text-decoration:none}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Vocabulário</h1>
<nav role="tablist">
<button role="tab" id="t-learn" aria-selected="true">Karteikarten</button>
<button role="tab" id="t-type" aria-selected="false">Schreiben</button>
<button role="tab" id="t-words" aria-selected="false">Wortschatz</button>
</nav>

<section id="learn">
<div class="boxes" id="boxes-learn"></div>
<p class="stat" id="stat"></p>
<div id="stage"></div>
</section>

<section id="type" class="hidden">
<div class="boxes" id="boxes-type"></div>
<p class="stat" id="tstat"></p>
<div id="tstage"></div>
</section>

<section id="words" class="hidden">
<form id="add">
<input id="pt" placeholder="Portugiesisch, z. B. obrigado" lang="pt-PT" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="true" required>
<a id="lk" class="lk" href="https://dicionario.priberam.org/" target="_blank" rel="noopener">Schreibweise bei Priberam prüfen</a>
<input id="de" placeholder="Deutsch, z. B. danke" autocomplete="off" required>
<button type="submit">Wort speichern</button>
</form>
<ul id="list"></ul>
<details id="backup" style="margin-top:24px">
<summary>Sichern &amp; übertragen</summary>
<p class="hint">„Code erstellen“ zeigt deine Wörter samt Fächern als Text. Kopiere ihn und füge ihn auf einem anderen Gerät oder unter einer neuen Adresse hier wieder ein, dann tippe auf „Importieren“.</p>
<textarea id="bk" rows="5" spellcheck="false" autocapitalize="off" placeholder="Hier erscheint dein Sicherungscode, oder füge einen Code zum Importieren ein"></textarea>
<div class="row2">
<button type="button" id="bk-make">Code erstellen</button>
<button type="button" id="bk-copy">Kopieren</button>
<button type="button" id="bk-imp">Importieren</button>
</div>
<p class="res near" id="bk-msg" role="status"></p>
</details>
</section>
</main>

<script>
var KEY = "vocab-pt-v1";
var DAY = 86400000;
var STEPS = [0, 1, 3, 7, 14];
var START = [
["olá","hallo"],["obrigado","danke (sagt ein Mann)"],["obrigada","danke (sagt eine Frau)"],
["por favor","bitte"],["bom dia","guten Morgen"],["boa noite","gute Nacht"],
["desculpe","Entschuldigung"],["a água","das Wasser"],["o pão","das Brot"],["a casa","das Haus"]
];
var words = load();
var current = null, revealed = false, practiceAll = false;
var note = "";
function renderBoxes(id, w){
  var counts = [0, 0, 0, 0, 0];
  words.forEach(function(x){counts[Math.min(Math.max(x.box | 0, 0), 4)]++;});
  document.getElementById(id).innerHTML = counts.map(function(n, i){
    var here = w && w.box === i;
    return '<div class="bx' + (here ? ' cur' : '') + '" aria-label="Fach ' + (i + 1) + ': ' + n + ' Wörter' + (here ? ', hier liegt das aktuelle Wort' : '') + '"><small>Fach ' + (i + 1) + '</small><b>' + n + '</b></div>';
  }).join("");
}
function moveNote(w, from, ok){
  if(!ok) return "Nicht gewusst: zurück in Fach 1";
  if(w.box === from) return "Gewusst: bleibt in Fach 5";
  return "Gewusst: weiter in Fach " + (w.box + 1);
}

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return START.map(function(w){return {pt:w[0],de:w[1],box:0,due:0};});
}
function save(){
  try{localStorage.setItem(KEY, JSON.stringify(words));}catch(e){}
}
function dueWords(){
  var now = Date.now();
  return words.filter(function(w){return practiceAll || w.due <= now;});
}
function speak(text){
  if(!window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-PT";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function esc(s){
  return s.replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
}
function renderLearn(){
  var due = dueWords();
  renderBoxes("boxes-learn", null);
  var stage = document.getElementById("stage");
  document.getElementById("stat").textContent = words.length ? due.length + " von " + words.length + " Wörtern sind dran" : "";
  if(!words.length){
    stage.innerHTML = '<p class="hint">Noch keine Wörter. Füge unter „Wortschatz“ dein erstes Wort hinzu.</p>';
    return;
  }
  if(!due.length){
    stage.innerHTML = '<p class="hint">Für heute bist du fertig. Die nächsten Wörter kommen später wieder dran.</p><button class="all" id="all">Trotzdem alle üben</button>';
    document.getElementById("all").onclick = function(){practiceAll = true; current = null; renderLearn();};
    return;
  }
  if(!current || due.indexOf(current) < 0){
    current = due[Math.floor(Math.random() * due.length)];
    revealed = false;
  }
  renderBoxes("boxes-learn", current);
  var html = (note ? '<p class="note">' + esc(note) + '</p>' : '') + '<button class="card" id="card" aria-label="Karte umdrehen"><span class="word">' + esc(current.pt) + '</span>';
  html += revealed ? '<span class="answer">' + esc(current.de) + '</span>' : '<span class="hint">Tippen, um die Übersetzung zu sehen</span>';
  html += '</button><div style="text-align:center"><button class="speak" id="say">Anhören</button></div>';
  if(revealed){
    html += '<div class="row"><button class="no" id="no">Nochmal</button><button class="yes" id="yes">Gewusst</button></div>';
  }
  stage.innerHTML = html;
  document.getElementById("card").onclick = function(){revealed = !revealed; note = ""; renderLearn();};
  document.getElementById("say").onclick = function(){speak(current.pt);};
  if(revealed){
    document.getElementById("yes").onclick = function(){grade(true);};
    document.getElementById("no").onclick = function(){grade(false);};
  }
}
function grade(ok){
  var from = current.box;
  current.box = ok ? Math.min(current.box + 1, STEPS.length - 1) : 0;
  current.due = Date.now() + STEPS[current.box] * DAY;
  if(!ok) current.due = Date.now();
  note = moveNote(current, from, ok);
  save();
  current = null;
  renderLearn();
}
var editIdx = -1;
function lookupUrl(pt){
  var t = norm(pt).replace(/^(o|a|os|as) /, "");
  return "https://dicionario.priberam.org/" + encodeURIComponent(t);
}
function renderList(){
  var ul = document.getElementById("list");
  if(!words.length){ul.innerHTML = '<li class="hint">Die Liste ist leer.</li>'; return;}
  ul.innerHTML = words.map(function(w, i){
    if(i === editIdx){
      return '<li><form class="edit"><input name="pt" value="' + esc(w.pt) + '" aria-label="Portugiesisch" lang="pt-PT" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="true" required><input name="de" value="' + esc(w.de) + '" aria-label="Deutsch" autocomplete="off" required><span class="acts"><button type="submit">Speichern</button><button type="button" class="cancel">Abbrechen</button></span></form></li>';
    }
    return '<li><div>' + esc(w.pt) + '<small>' + esc(w.de) + ' (Fach ' + (w.box + 1) + ')</small></div><span class="acts"><button type="button" data-a="edit" data-i="' + i + '">Ändern</button><a href="' + lookupUrl(w.pt) + '" target="_blank" rel="noopener">Nachschlagen</a><button type="button" class="del" data-a="del" data-i="' + i + '">Löschen</button></span></li>';
  }).join("");
  Array.prototype.forEach.call(ul.querySelectorAll("button[data-a]"), function(b){
    b.onclick = function(){
      var i = +b.dataset.i;
      if(b.dataset.a === "edit"){
        editIdx = i; renderList();
        var f = ul.querySelector(".edit input");
        if(f) f.focus();
      }else{
        words.splice(i, 1);
        editIdx = -1; save(); current = null; tw = null; renderList();
      }
    };
  });
  var form = ul.querySelector("form.edit");
  if(form){
    form.onsubmit = function(e){
      e.preventDefault();
      var w = words[editIdx];
      var pt = form.elements.pt.value.trim(), de = form.elements.de.value.trim();
      if(!pt || !de) return;
      w.pt = pt; w.de = de;
      editIdx = -1; save(); renderList();
    };
    form.querySelector(".cancel").onclick = function(){editIdx = -1; renderList();};
  }
}
document.getElementById("add").onsubmit = function(e){
  e.preventDefault();
  var pt = document.getElementById("pt"), de = document.getElementById("de");
  words.unshift({pt:pt.value.trim(), de:de.value.trim(), box:0, due:0});
  save(); pt.value = ""; de.value = ""; document.getElementById("lk").href = lookupUrl(""); pt.focus(); renderList();
};
var tw = null, tstate = null, tvalue = "", tright = 0, ttotal = 0;
function norm(s){return s.toLowerCase().replace(/\s+/g, " ").trim();}
function plain(s){return norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");}
function noArt(s){return s.replace(/^(o|a|os|as) /, "");}
function same(a, b, f){a = f(a); b = f(b); return a === b || noArt(a) === noArt(b);}
function applyResult(w, ok){
  w.box = ok ? Math.min(w.box + 1, STEPS.length - 1) : 0;
  w.due = ok ? Date.now() + STEPS[w.box] * DAY : Date.now();
  save();
}
function renderType(){
  var box = document.getElementById("tstage");
  renderBoxes("boxes-type", null);
  document.getElementById("tstat").textContent = ttotal ? tright + " von " + ttotal + " richtig" : "";
  if(!words.length){
    box.innerHTML = '<p class="hint">Noch keine Wörter. Füge unter „Wortschatz“ dein erstes Wort hinzu.</p>';
    return;
  }
  if(!tw || words.indexOf(tw) < 0){
    tw = words[Math.floor(Math.random() * words.length)];
    tstate = null; tvalue = "";
  }
  renderBoxes("boxes-type", tw);
  var html = (note ? '<p class="note">' + esc(note) + '</p>' : '') + '<div class="card"><span class="hint">Wie heißt das auf Portugiesisch?</span><span class="word">' + esc(tw.de) + '</span></div>';
  html += '<form id="tform" style="margin-top:20px"><input id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Portugiesisch eintippen" value="' + esc(tvalue) + '"' + (tstate ? ' readonly' : '') + '>';
  if(tstate === "ok"){html += '<p class="res ok">Richtig!</p>';}
  if(tstate === "near"){html += '<p class="res near">Fast: achte auf die Akzente. Richtig: ' + esc(tw.pt) + '</p>';}
  if(tstate === "bad"){html += '<p class="res bad">Nicht ganz. Richtig: ' + esc(tw.pt) + '</p>';}
  html += '<button type="submit" id="tbtn">' + (tstate ? 'Weiter' : 'Prüfen') + '</button>';
  if(tstate){html += '<button type="button" class="speak" id="tsay">Anhören</button>';}
  html += '</form>';
  box.innerHTML = html;
  document.getElementById("tform").onsubmit = function(e){
    e.preventDefault();
    if(tstate){tw = null; tstate = null; tvalue = ""; note = ""; renderType(); return;}
    var val = document.getElementById("tin").value;
    if(!val.trim()) return;
    tvalue = val;
    var ok = same(val, tw.pt, norm);
    tstate = ok ? "ok" : (same(val, tw.pt, plain) ? "near" : "bad");
    ttotal++;
    if(ok) tright++;
    var from = tw.box;
    applyResult(tw, ok);
    note = moveNote(tw, from, ok);
    renderType();
  };
  if(tstate){
    document.getElementById("tsay").onclick = function(){speak(tw.pt);};
    document.getElementById("tbtn").focus();
  }else{
    document.getElementById("tin").focus();
  }
}
function show(tab){
  note = ""; editIdx = -1;
  ["learn", "type", "words"].forEach(function(t){
    document.getElementById(t).classList.toggle("hidden", t !== tab);
    document.getElementById("t-" + t).setAttribute("aria-selected", t === tab);
  });
  if(tab === "learn"){renderLearn();}
  else if(tab === "type"){renderType();}
  else{renderList();}
}
var ptIn = document.getElementById("pt"), lk = document.getElementById("lk");
ptIn.addEventListener("input", function(){lk.href = lookupUrl(ptIn.value);});
function bkMsg(t, ok){
  var m = document.getElementById("bk-msg");
  m.textContent = t;
  m.className = "res " + (ok ? "ok" : "bad");
}
function bkSelect(){
  var ta = document.getElementById("bk");
  ta.focus(); ta.select();
  try{ta.setSelectionRange(0, ta.value.length);}catch(e){}
  return ta;
}
document.getElementById("bk-make").onclick = function(){
  document.getElementById("bk").value = JSON.stringify({app:"vocab-pt", v:1, words:words});
  bkSelect();
  bkMsg("Code erstellt. Tippe jetzt auf „Kopieren“.", true);
};
document.getElementById("bk-copy").onclick = function(){
  var ta = bkSelect();
  if(!ta.value){bkMsg("Erstelle zuerst einen Code.", false); return;}
  var done = function(){bkMsg("Kopiert.", true);};
  var fallback = function(){
    var ok = false;
    try{ok = document.execCommand("copy");}catch(e){}
    bkMsg(ok ? "Kopiert." : "Der Code ist markiert. Bitte manuell kopieren.", ok);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done, fallback);}
  else{fallback();}
};
document.getElementById("bk-imp").onclick = function(){
  var raw = document.getElementById("bk").value.trim();
  try{
    var d = JSON.parse(raw);
    var list = Array.isArray(d) ? d : d.words;
    if(!Array.isArray(list)) throw new Error("format");
    var n = 0;
    list.forEach(function(w){
      if(!w || typeof w.pt !== "string" || typeof w.de !== "string") return;
      var item = {pt:w.pt.trim(), de:w.de.trim(), box:Math.min(Math.max(w.box | 0, 0), 4), due:+w.due || 0};
      var ex = words.filter(function(x){return norm(x.pt) === norm(item.pt) && norm(x.de) === norm(item.de);})[0];
      if(ex){ex.box = item.box; ex.due = item.due;}else{words.push(item);}
      n++;
    });
    save(); renderList();
    bkMsg(n + " Wörter importiert.", true);
  }catch(e){bkMsg("Der Code ist nicht gültig.", false);}
};
document.getElementById("t-learn").onclick = function(){show("learn");};
document.getElementById("t-type").onclick = function(){show("type");};
document.getElementById("t-words").onclick = function(){show("words");};
(function(){
  try{
    var c = document.createElement("canvas");
    c.width = 180; c.height = 180;
    var g = c.getContext("2d");
    function dot(x, y, r, col){g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();}
    g.fillStyle = "#1f4e9c"; g.fillRect(0, 0, 180, 180);
    [[0, 0], [180, 0], [0, 180], [180, 180]].forEach(function(p){dot(p[0], p[1], 38, "#ffffff"); dot(p[0], p[1], 22, "#1f4e9c");});
    var pts = [[90, 50], [130, 90], [90, 130], [50, 90]];
    pts.forEach(function(p){dot(p[0], p[1], 27, "#ffffff"); dot(p[0], p[1], 8, "#1f4e9c");});
    dot(90, 90, 22, "#e0a526");
    dot(90, 90, 9, "#1f4e9c");
    var l = document.createElement("link");
    l.rel = "apple-touch-icon";
    l.href = c.toDataURL("image/png");
    document.head.appendChild(l);
  }catch(e){}
})();
renderLearn();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
